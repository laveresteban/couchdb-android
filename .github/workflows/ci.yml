name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      couchdb:
        image: couchdb:3
        ports: ["5984:5984"]
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Wait for CouchDB
        run: for i in $(seq 30); do curl -sf localhost:5984/_up && break; sleep 2; done
      - name: Core tests (unit + replication against CouchDB)
        run: ./gradlew :sync-core:test

  conformance:
    runs-on: ubuntu-latest
    services:
      couchdb:
        image: couchdb:3
        ports: ["5984:5984"]
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: laveresteban/couchdb-sdk-generator
          path: couchdb-sdk-generator
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - uses: getgauge/setup-gauge@master
        with:
          gauge-plugins: java
      - name: Wait for CouchDB
        run: for i in $(seq 30); do curl -sf localhost:5984/_up && break; sleep 2; done
      - name: Gauge conformance specs
        run: scripts/conformance.sh couchdb-sdk-generator

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with:
          # The default also installs 'tools', which newer SDK tooling no longer has.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android library
        run: ./gradlew :android:assembleRelease
      - name: Start CouchDB for device tests
        run: docker run -d -p 5984:5984 -e COUCHDB_USER=admin -e COUCHDB_PASSWORD=password couchdb:3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: ./gradlew :android:connectedDebugAndroidTest
