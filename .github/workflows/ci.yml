name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      couchdb:
        image: couchdb:3.4
        ports: ["5984:5984"]
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install PouchDB for the interop test
        run: npm ci
        working-directory: interop
      - name: Wait for CouchDB
        run: for i in $(seq 30); do curl -sf localhost:5984/_up && break; sleep 2; done
      - name: Lint and test sync-core (CouchDB replication, PouchDB interop)
        run: ./gradlew :sync-core:ktlintCheck :sync-core:test :sync-core:koverVerify
        env:
          ANDROID_HOME: "" # runners ship an SDK; keep the Android modules out of JVM jobs
      - name: Keep test reports when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-core-test-reports
          path: sync-core/build/test-results/test

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      couchdb:
        image: couchdb:3.4
        ports: ["5984:5984"]
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: laveresteban/couchdb-sdk-generator
          path: couchdb-sdk-generator
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - uses: getgauge/setup-gauge@159e01e975eeae8bd1a097017590fefbc36e2d4e # master, Oct 2026 (no tags)
        with:
          gauge-plugins: java
      - name: Wait for CouchDB
        run: for i in $(seq 30); do curl -sf localhost:5984/_up && break; sleep 2; done
      - name: Gauge conformance specs (shared and SDK)
        run: scripts/conformance.sh couchdb-sdk-generator
        env:
          ANDROID_HOME: ""

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with:
          # The default also installs 'tools', which newer SDK tooling no longer has.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint and format check
        run: ./gradlew ktlintCheck :android:lintRelease :example-notes:lintDebug
      - name: Robolectric unit tests and coverage
        run: ./gradlew :android:testDebugUnitTest :android:koverVerify
      - name: Build library and example app
        run: ./gradlew :android:assembleRelease :example-notes:assembleDebug

  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Start CouchDB for device tests
        run: docker run -d -p 5984:5984 -e COUCHDB_USER=admin -e COUCHDB_PASSWORD=password couchdb:3.4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: ./gradlew :android:connectedDebugAndroidTest
